name: Build DayLater APK

on:
  push:
    branches:
      - chatgpt/daylater-apk-build-20260908
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: daylater
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: daylater-debug-apk
          path: daylater/app/build/outputs/apk/debug/app-debug.apk
